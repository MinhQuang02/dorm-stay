<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Payment</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain" onerror="this.src='https://placehold.co/100x40?text=Logo'">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Contract Payment
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 md:px-16 py-14 flex flex-col items-center">
            
            <div class="w-full max-w-5xl">
                
                <h2 class="text-3xl md:text-[32px] font-bold text-[#333333] mb-8">
                    Choose your contract
                </h2>

                <div class="bg-[#faeddb] rounded-[24px] p-8 md:p-10 flex flex-col shadow-sm border border-[#f0e3ce]">
                    
                    <div class="flex flex-col md:flex-row gap-8 md:gap-12 w-full">
                        <div class="w-48 h-48 md:w-56 md:h-56 bg-[#fde9d2] rounded-xl flex items-center justify-center flex-shrink-0 shadow-inner">
                            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M25 25H55C68.807 25 80 36.193 80 50C80 63.807 68.807 75 55 75H25V25Z" fill="#F97316"/>
                                <path d="M25 25L55 55H25V25Z" fill="#3B82F6"/>
                                <path d="M25 55L55 85H80L50 55H25Z" fill="#2563EB"/>
                            </svg>
                        </div>

                        <div class="flex-1 flex flex-col justify-center">
                            <div class="mb-6">
                                <span class="text-[19px] font-bold text-[#cc6b34]">Contract Code: </span>
                                <span class="text-[19px] font-bold text-gray-600">#2020-05-0001</span>
                            </div>

                            <div class="grid grid-cols-2 md:grid-cols-3 gap-y-6 gap-x-4">
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Owner</p>
                                    <p class="text-[14px] text-gray-600 font-medium">Phan Quang Minh <span class="text-[#cc6b34]">(+5)</span></p>
                                </div>
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Creator</p>
                                    <p class="text-[14px] text-gray-600 font-medium">Huynh Van Sinh</p>
                                </div>
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Contract Status</p>
                                    <p class="text-[14px] text-gray-600 font-medium">Deposit can refunded</p>
                                </div>

                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Form of Rental</p>
                                    <p class="text-[14px] text-gray-600 font-medium">By Bed</p>
                                </div>
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Start Date</p>
                                    <p class="text-[14px] text-gray-600 font-medium">20/11/2025</p>
                                </div>
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Payment Period</p>
                                    <p class="text-[14px] text-gray-600 font-medium">The 5th</p>
                                </div>

                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">Creation Date</p>
                                    <p class="text-[14px] text-gray-600 font-medium">17/11/2025</p>
                                </div>
                                <div>
                                    <p class="text-[13px] text-gray-500 font-bold mb-1">End Date</p>
                                    <p class="text-[14px] text-gray-600 font-medium">26/03/2026</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-8 w-full">
                        <button onclick="location.href='mailto:mphanquang06@gmail.com'" class="bg-[#f0dfcc] hover:bg-[#e6d3bd] text-[#cc6b34] text-[13px] font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition-colors shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v1.5M3 21v-6m0 0 2.77-.693a15.26 15.26 0 0 1 9.46 0l2.77.693M3 15h18M3 4.5h18m-9-1.5v1.5m0 12v1.5" />
                            </svg>
                            Report this
                        </button>

                        <button onclick="location.href='payment.html'" class="bg-[#cc6b34] hover:bg-[#b55e2d] text-white text-[14px] font-semibold px-8 py-2.5 rounded-lg flex items-center gap-2 transition-colors shadow-md">
                            Continue
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                            </svg>
                        </button>
                    </div>

                </div>
            </div>

        </main>

    </div>

</body>
</html>
