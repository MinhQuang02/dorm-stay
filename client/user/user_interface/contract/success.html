<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain" onerror="this.src='https://placehold.co/100x40?text=Logo'">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Contract Payment
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>

            </div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center px-6 py-12">
            
            <div class="w-full max-w-2xl bg-white rounded-[2.5rem] p-10 md:p-16 shadow-sm border border-gray-100 flex flex-col items-center text-center">
                
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-8">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="#10b981" class="w-12 h-12">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>

                <h2 class="text-[#cc6b34] font-['Playfair_Display'] text-4xl font-extrabold mb-4">
                    Payment Successful!
                </h2>
                <p class="text-gray-500 text-lg mb-10 max-w-md">
                    Hooray! Your payment has been processed successfully. A confirmation email has been sent to your inbox.
                </p>

                <div class="w-full bg-[#faeddb] bg-opacity-50 rounded-2xl p-6 mb-10 text-left border border-[#f0e3ce]">
                    <div class="grid grid-cols-2 gap-y-4">
                        <div>
                            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Amount Paid</p>
                            <p class="text-xl font-bold text-black">3.500.000đ</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Transaction ID</p>
                            <p class="text-sm font-semibold text-gray-700">#NDS-99281044</p>
                        </div>
                        <div>
                            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Date</p>
                            <p class="text-sm font-semibold text-gray-700">Aug 28, 2022</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Payment Method</p>
                            <p class="text-sm font-semibold text-gray-700">Bank Transfer</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 w-full">
                    <button onclick="location.href='../homepage.html'" class="flex-1 bg-[#cc6b34] hover:bg-[#b55e2d] text-white font-bold py-4 rounded-xl transition-all shadow-md">
                        Back to Home
                    </button>
                    <button class="flex-1 bg-white border-2 border-[#cc6b34] text-[#cc6b34] font-bold py-4 rounded-xl hover:bg-[#faeddb] transition-all">
                        View Contract
                    </button>
                </div>

                <p class="mt-8 text-gray-400 text-sm">
                    Having issues? <a href="mailto:mphanquang06@gmail.com" class="text-[#cc6b34] underline font-medium">Contact support</a>
                </p>

            </div>

        </main>
        
    </div>

</body>
