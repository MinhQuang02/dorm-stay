<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Rental Registration</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Room Rental Registration
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 px-8 md:px-24 py-12 flex flex-col items-center">
            
            <div class="w-full max-w-4xl">
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Personal Info</h2>
                    <p class="text-sm text-gray-500">Please fill in your information so we can support you best:</p>
                </div>

                <form class="flex flex-col gap-6">
                    
                    <div class="flex flex-col gap-2">
                        <label class="text-[13px] font-bold text-gray-600">Full Name <span class="text-gray-600">*</span></label>
                        <input type="text" placeholder="Enter Full Name" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#cc6b34] transition-colors shadow-sm placeholder-gray-400">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[13px] font-bold text-gray-600">ID Card <span class="text-gray-600">*</span></label>
                        <input type="text" placeholder="Enter ID number" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#cc6b34] transition-colors shadow-sm placeholder-gray-400">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[13px] font-bold text-gray-600">Phone Number <span class="text-gray-600">*</span></label>
                        <input type="tel" placeholder="Enter phone number" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#cc6b34] transition-colors shadow-sm placeholder-gray-400">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[13px] font-bold text-gray-600">Email <span class="text-gray-600">*</span></label>
                        <input type="email" placeholder="Enter email" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#cc6b34] transition-colors shadow-sm placeholder-gray-400">
                    </div>

                    <div class="mt-6">
                        <button type="button" class="w-full border border-dashed border-gray-300 bg-transparent rounded-xl py-5 flex items-center justify-center gap-2 text-gray-500 text-sm font-medium hover:bg-gray-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                            Add new Customers
                        </button>
                        <p class="text-[12px] text-gray-400 mt-2">Click to add a new customer.</p>
                    </div>

                    <div class="flex justify-between items-center mt-12">
                        <button onclick="location.href='../homepage.html'" type="button" class="px-12 py-3 rounded-lg border border-[#cc6b34] text-[#cc6b34] text-sm font-medium hover:bg-[#faeddb] transition-colors">
                            Cancel
                        </button>
                        <button onclick="location.href='find.html'" type="button" class="px-12 py-3 rounded-lg bg-[#cc6b34] text-white text-sm font-medium hover:bg-[#b55e2d] transition-colors shadow-md">
                            Next
                        </button>
                    </div>

                </form>

                <div class="mt-12 mb-8 text-center">
                    <p class="text-[13px] text-[#cc6b34] font-medium">*Please enter a valid phone number/email format</p>
                </div>
            </div>

        </main>

        </div>

</body>
</html>
