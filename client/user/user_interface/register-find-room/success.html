<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Rental Registration</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain" onerror="this.src='https://placehold.co/100x40?text=Logo'">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Room Rental Registration
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center py-16 px-6">
            
            <div class="flex flex-col items-center mb-12">
                <div class="w-20 h-20 bg-[#fdf5e9] rounded-full flex items-center justify-center mb-6">
                    <span class="text-3xl">🎉</span>
                </div>
                <h2 class="text-[32px] font-bold text-gray-900 mb-3">Your booking is confirmed!</h2>
                <p class="text-gray-500 text-center max-w-md leading-relaxed">
                    Our staff will contact you soon to confirm and send the detailed viewing schedule.
                </p>
            </div>

            <div class="w-full max-w-3xl">
                
                <div class="mb-8">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">Private office</h3>
                    <div class="space-y-1">
                        <p class="text-sm text-gray-500">
                            <span class="font-bold text-gray-900 mr-2">Adress</span> 8383 Wilshire Boulevard Beverly Hills, CA
                        </p>
                        <p class="text-sm text-gray-500">
                            <span class="font-bold text-gray-900 mr-2">Phone</span> 123456789
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div class="h-56 rounded-2xl overflow-hidden shadow-sm">
                        <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=800&q=80" 
                             alt="Room" class="w-full h-full object-cover">
                    </div>
                    <div class="h-56 rounded-2xl overflow-hidden shadow-sm border border-gray-100">
                        <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80" 
                             alt="Location Map" class="w-full h-full object-cover opacity-80">
                    </div>
                </div>

                <div class="space-y-4 border-t border-gray-100 pt-8">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-900 font-bold">Date of your meeting</span>
                        <span class="text-gray-500">16 August 2020</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-900 font-bold">Number of guests</span>
                        <span class="text-gray-500">4 people</span>
                    </div>
                </div>

            </div>
        </main>
        
    </div>

</body>
</html>
