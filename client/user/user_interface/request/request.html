<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move-out Request</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain" onerror="this.src='https://placehold.co/100x40?text=Logo'">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Move-out Request
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 md:px-12 py-12 flex justify-center">
            
            <div class="w-full max-w-4xl">
                
                <div class="mb-10">
                    <h2 class="text-xl font-bold text-black mb-4">1. Current Contract Information</h2>
                    
                    <div class="bg-[#f8eedf] border border-[#e8dccb] rounded-[2rem] p-8 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-y-8 gap-x-4 shadow-sm">
                        
                        <div>
                            <p class="text-[13px] text-gray-500 font-semibold mb-2 uppercase tracking-wide">CONTRACT ID</p>
                            <p class="font-bold text-[17px] text-black">HD-2025-0012</p>
                        </div>

                        <div>
                            <p class="text-[13px] text-gray-500 font-semibold mb-2 uppercase tracking-wide">ROOM / BED</p>
                            <p class="font-bold text-[17px] text-black">Room 301 - Studio</p>
                        </div>

                        <div>
                            <p class="text-[13px] text-gray-500 font-semibold mb-2 uppercase tracking-wide">NAME</p>
                            <p class="font-bold text-[17px] text-black">Nguyen Van A</p>
                        </div>

                        <div>
                            <p class="text-[13px] text-gray-500 font-semibold mb-2 uppercase tracking-wide">CONTRACT PERIOD</p>
                            <p class="font-bold text-[17px] text-black">15/05/2025 - 15/05/2026</p>
                        </div>

                    </div>
                </div>

                <div class="mb-10">
                    <h2 class="text-xl font-bold text-black mb-4">2. Move-out Details</h2>
                    <h3 class="text-lg font-bold text-black mb-3">Expected Move-out Date (*)</h3>
                    
                    <div class="border border-gray-400 rounded-lg p-2 w-full bg-white shadow-sm hover:border-gray-500 transition-colors">
                        <label class="block text-[10px] text-gray-600 ml-1 leading-none">Date</label>
                        <input type="text" value="28.08.2022" class="w-full outline-none text-gray-800 text-[15px] bg-transparent ml-1 mt-1 font-medium" />
                    </div>
                </div>

                <div class="mb-12">
                    <h2 class="text-xl font-bold text-black mb-4">3. Reason / Additional Notes</h2>
                    
                    <textarea 
                        class="w-full h-48 border-2 border-[#cc6b34] rounded-[2rem] p-6 text-gray-800 text-[15px] outline-none resize-none bg-white shadow-sm focus:ring-4 focus:ring-[#faeddb] transition-all" 
                        placeholder="Please enter your reason or any additional requests (if any)..."></textarea>
                </div>

                <div class="flex justify-center pb-8">
                    <button onclick="location.href='../homepage.html'" class="bg-[#cc6b34] text-white font-semibold py-4 px-10 rounded-2xl shadow-md hover:bg-[#b55e2d] hover:shadow-lg transition-all w-full max-w-[500px] text-lg">
                        SUBMIT Move-out Request
                    </button>
                </div>

            </div>

        </main>
        
        </div>

</body>
</html>
