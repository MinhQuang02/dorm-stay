<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="icon" type="image/svg+xml" href="../logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen w-full">

    <div class="w-[calc(100%-210px)] max-w-[1600px] bg-[#fafaf9] shadow-2xl relative flex flex-col min-h-screen">
        
        <header class="sticky top-0 z-50 bg-[#faeddb] rounded-b-3xl px-6 md:px-12 py-4 grid grid-cols-[auto_1fr_auto] items-center shadow-sm transition-all">
            <div class="flex-shrink-0">
                <a href="../homepage.html">
                    <img src="../logo.svg" alt="Logo" class="h-10 md:h-12 object-contain" onerror="this.src='https://placehold.co/100x40?text=Logo'">
                </a>
            </div>

            <h1 class="hidden md:block text-center text-[#cc6b34] font-['Playfair_Display'] text-3xl font-bold tracking-wide translate-x-[40px]">
                Deposit Payment
            </h1>

            <div class="flex items-center gap-6 justify-end">
                <a href="mailto:mphanquang06@gmail.com" class="text-sm font-medium text-gray-600 hover:text-[#cc6b34] transition-colors hidden sm:block">Contact us</a>
                <button onclick="location.href='../login.html'" class="bg-[#cc6b34] text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-[#b55e2d] transition-colors">
                    mphanquang
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center text-center px-8">
            
            <div class="max-w-2xl w-full flex flex-col items-center">
                <h2 class="text-5xl md:text-6xl font-extrabold text-[#ce713b] font-['Playfair_Display'] tracking-widest mb-8">
                    SUCCESS
                </h2>
                
                <p class="text-gray-500 text-[15px] md:text-[16px] leading-relaxed max-w-lg mb-12">
                    The payment process was successful, more details about the invoice and how to download it can be accessed below.
                </p>

                <div class="mb-16">
                    <div class="w-32 h-32 md:w-40 md:h-40 border-[10px] border-[#ce713b] rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="4" stroke="currentColor" class="w-16 h-16 md:w-20 md:h-20 text-[#ce713b] -mt-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                        </svg>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-x-12 gap-y-4">
                    <a href="#" class="text-[13px] text-gray-400 font-medium hover:text-[#cc6b34] transition-all underline-offset-4 hover:underline">
                        Open invoice details
                    </a>
                    <a href="#" class="text-[13px] text-gray-400 font-medium hover:text-[#cc6b34] transition-all underline-offset-4 hover:underline">
                        Download invoice
                    </a>
                    <a href="../homepage.html" class="text-[13px] text-gray-400 font-medium hover:text-[#cc6b34] transition-all underline-offset-4 hover:underline">
                        Return to home page
                    </a>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
