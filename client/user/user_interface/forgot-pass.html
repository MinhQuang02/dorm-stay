<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0; /* Nền xám nhạt để làm nổi bật khung thiết kế */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

    <div class="w-full max-w-[1000px] h-[85vh] max-h-[700px] bg-[#f8fafd] flex shadow-2xl rounded-2xl overflow-hidden">
        
        <div class="w-full md:w-1/2 flex items-center justify-center p-8 lg:p-14 relative">
            <div class="w-full max-w-md">
                
                <div class="w-12 h-12 bg-orange-100 text-[#d47435] rounded-xl flex items-center justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
                    </svg>
                </div>

                <h1 class="text-[32px] font-bold text-[#1a1f2c] mb-2">Forgot Password?</h1>
                <p class="text-[14px] text-gray-500 mb-8 leading-relaxed">
                    Don't worry! It happens. Please enter the email associated with your account and we'll send an email with instructions to reset your password.
                </p>

                <form action="#" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-[13px] text-gray-500 mb-1.5">E-mail address</label>
                        <input type="email" placeholder="Enter your email" required
                            class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3.5 text-[14px] text-gray-700 outline-none focus:border-[#d47435] focus:ring-1 focus:ring-[#d47435] transition-all">
                    </div>

                    <button type="submit" class="w-full bg-[#d47435] text-white rounded-lg py-3.5 text-[15px] font-medium hover:bg-[#c3682e] transition-colors shadow-sm">
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <a href="login.html" class="inline-flex items-center gap-2 text-[14px] font-medium text-gray-500 hover:text-[#d47435] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                        Back to Sign in
                    </a>
                </div>
            </div>
        </div>

        <div class="hidden md:block w-1/2 relative bg-gray-200">
            <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Hostel Dormitory" class="w-full h-full object-cover">
            
            <div class="absolute inset-0 bg-black/10"></div>
        </div>
    </div>

</body>
</html>
