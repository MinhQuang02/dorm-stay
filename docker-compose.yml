version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dormstay-server
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - PORT=5000
    command: npm run dev
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dormstay-client
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PORT=5173
    depends_on:
      - server
    restart: always

  db:
    image: postgres:15-alpine
    container_name: dormstay-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dormstay
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

volumes:
  db-data:
