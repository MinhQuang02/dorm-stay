version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dormstay-server
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - PORT=5000
    command: npm run dev
    restart: always

  client-user:
    build:
      context: ./client/user
      dockerfile: Dockerfile
    container_name: dormstay-client-user
    ports:
      - '5173:5173'
    volumes:
      - ./client/user:/app
      - /app/node_modules
    command: npm run dev -- --host --port 5173
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PORT=5173
    depends_on:
      - server
    restart: always

  client-admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile
    container_name: dormstay-client-admin
    ports:
      - '5174:5174'
    volumes:
      - ./client/admin:/app
      - /app/node_modules
    command: npm run dev -- --host --port 5174
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PORT=5174
    depends_on:
      - server
    restart: always

  db:
    image: postgres:15-alpine
    container_name: dormstay-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dormstay
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

volumes:
  db-data:
